syntax = "proto3";

package mobile.testing.v1;

option swift_prefix = "MobileTesting_";
option java_multiple_files = true;
option java_package = "mobile.testing.v1";

import "common.proto";
import "accessibility.proto";
import "ai.proto";

service CompanionService {
  // Session lifecycle
  rpc StartSession (StartSessionRequest) returns (StartSessionResponse);
  rpc GetCapabilities (CapabilitiesRequest) returns (CapabilitiesResponse);
  rpc EndSession (EndSessionRequest) returns (EndSessionResponse);

  // Touch actions
  rpc Tap (TapRequest) returns (ActionResponse);
  rpc DoubleTap (TapRequest) returns (ActionResponse);
  rpc LongPress (LongPressRequest) returns (ActionResponse);
  rpc TapElement (TapElementRequest) returns (ActionResponse);

  // Gesture actions
  rpc Swipe (SwipeRequest) returns (ActionResponse);
  rpc Scroll (ScrollRequest) returns (ActionResponse);
  rpc ScrollToElement (ScrollToElementRequest) returns (ActionResponse);
  rpc Pinch (PinchRequest) returns (ActionResponse);
  rpc Drag (DragRequest) returns (ActionResponse);

  // Text actions
  rpc TypeText (TypeTextRequest) returns (ActionResponse);
  rpc ClearText (ClearTextRequest) returns (ActionResponse);
  rpc SetText (SetTextRequest) returns (ActionResponse);

  // Navigation
  rpc PressBack (Empty) returns (ActionResponse);
  rpc PressHome (Empty) returns (ActionResponse);

  // Accessibility queries
  rpc GetViewHierarchy (ViewHierarchyRequest) returns (ViewHierarchyResponse);
  rpc FindElements (FindElementsRequest) returns (FindElementsResponse);
  rpc WaitForElement (WaitForElementRequest) returns (WaitForElementResponse);
  rpc IsKeyboardVisible (Empty) returns (KeyboardVisibleResponse);

  // AI context
  rpc GetScreenContext (ScreenContextRequest) returns (ScreenContextResponse);
  rpc FindByDescription (FindByDescriptionRequest) returns (FindElementsResponse);
  rpc GetInteractableElements (Empty) returns (InteractableElementsResponse);

  // Capture
  rpc TakeScreenshot (ScreenshotRequest) returns (ScreenshotResponse);
}

// Session messages

message StartSessionRequest {
  string requested_session_id = 1;
  string app_id = 2;
}

message StartSessionResponse {
  string session_id = 1;
}

message CapabilitiesRequest {}

message CapabilitiesResponse {
  repeated CapabilityDescriptor capabilities = 1;
}

message EndSessionRequest {
  string session_id = 1;
}

message EndSessionResponse {
  bool ended = 1;
}

// Touch messages

message TapRequest {
  Point point = 1;
}

message LongPressRequest {
  Point point = 1;
  Duration duration = 2;
}

message TapElementRequest {
  ElementSelector selector = 1;
  string app_id = 2;
  repeated string candidate_bundle_ids = 3;
}

// Gesture messages

message SwipeRequest {
  Point from = 1;
  Point to = 2;
  Duration duration = 3;
}

message ScrollRequest {
  Direction direction = 1;
  float distance = 2;
}

message ScrollToElementRequest {
  ElementSelector selector = 1;
  Direction direction = 2;
  int32 max_scrolls = 3;
}

message PinchRequest {
  Point center = 1;
  float scale = 2;
  float velocity = 3;
}

message DragRequest {
  Point from = 1;
  Point to = 2;
  Duration duration = 3;
  Duration hold_duration = 4;
}

// Text messages

message TypeTextRequest {
  string text = 1;
}

message ClearTextRequest {
  int32 character_count = 1;
}

message SetTextRequest {
  ElementSelector selector = 1;
  string text = 2;
}

// Capture messages

message ScreenshotRequest {
  string format = 1;
}

message ScreenshotResponse {
  bytes data = 1;
}

// Device info messages

message KeyboardVisibleResponse {
  bool visible = 1;
}
