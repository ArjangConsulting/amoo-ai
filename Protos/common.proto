syntax = "proto3";

package amoo.v1;

option swift_prefix = "Amoo_";
option java_multiple_files = true;
option java_package = "amoo.v1";

message Empty {}

message Point {
  double x = 1;
  double y = 2;
}

message Rect {
  double x = 1;
  double y = 2;
  double width = 3;
  double height = 4;
}

message Duration {
  int32 milliseconds = 1;
}

enum CapabilityTier {
  CAPABILITY_TIER_UNSPECIFIED = 0;
  CAPABILITY_TIER_REQUIRED = 1;
  CAPABILITY_TIER_OPTIONAL = 2;
}

message CapabilityDescriptor {
  string key = 1;
  CapabilityTier tier = 2;
  bool supported = 3;
  string reason_if_unsupported = 4;
}

message ElementSelector {
  string id = 1;
  string label = 2;
  string contains_text = 3;
  string description = 4;
  ElementSelector parent_selector = 5;
  string type = 6;
  string value = 7;
  int32 index = 8;
  // Restrict results to elements that carry an identifier or a label.
  //
  // Off by default: an unfiltered query returns unlabeled elements too, so an icon-only
  // control with no accessibility label is still reachable by its frame rather than being
  // invisible to every query. Set this when a caller wants only elements it can name —
  // the screen summary does, since it describes a screen by what its elements are called.
  //
  // The accessibility reports deliberately leave it off: an element with neither identifier
  // nor label is the finding they exist to produce.
  //
  // Has no effect alongside id/label/contains_text: an unlabeled element cannot match any
  // of those anyway.
  bool labeled_only = 9;
}

message ElementInfo {
  string id = 1;
  string label = 2;
  string value = 3;
  string type = 4;
  Rect frame = 5;
  bool is_enabled = 6;
  bool is_visible = 7;
  // Preferred interaction coordinate in screen points. Unlike frame center, this is
  // constrained to the portion of the element visible inside the current viewport.
  Point hit_point = 8;
  bool is_secure_text_entry = 9;
}

message ViewNode {
  string id = 1;
  string label = 2;
  repeated ViewNode children = 3;
  string type = 4;
  string value = 5;
  Rect frame = 6;
  bool is_enabled = 7;
  bool is_visible = 8;
  Point hit_point = 9;
  bool is_secure_text_entry = 10;
}

message ActionResponse {
  bool success = 1;
  string message = 2;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_UP = 1;
  DIRECTION_DOWN = 2;
  DIRECTION_LEFT = 3;
  DIRECTION_RIGHT = 4;
}
