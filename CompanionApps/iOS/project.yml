name: AmooCompanion
options:
  bundleIdPrefix: com.amoo
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  useBaseInternationalization: false
  packageResolutionPolicy: lockFile

packages:
  grpc-swift-2:
    url: https://github.com/grpc/grpc-swift-2.git
    exactVersion: "2.3.0"
  grpc-swift-protobuf:
    url: https://github.com/grpc/grpc-swift-protobuf.git
    exactVersion: "2.2.0"
  grpc-swift-nio-transport:
    url: https://github.com/grpc/grpc-swift-nio-transport.git
    exactVersion: "2.4.4"
  swift-protobuf:
    url: https://github.com/apple/swift-protobuf.git
    exactVersion: "1.36.0"
  SwiftTestCommons:
    url: https://github.com/maniramezan/SwiftTestCommons.git
    from: "0.4.2"

settings:
  base:
    SWIFT_VERSION: "6"
    AMOO_RECOVERY_APP_GROUP: group.com.amoo.companion

targets:
  AmooCompanion:
    type: application
    platform: iOS
    sources:
      - path: HostApp
    info:
      path: HostApp/Info.plist
      properties:
        # HostApp/App.swift's .onOpenURL handler expects amoo:// links (used by
        # testOpenURLAndScreenshot and the "Open Deep Link" fixture screen). xcodegen
        # regenerates HostApp/Info.plist from this project.yml on every `xcodegen generate` —
        # editing the plist file directly does not survive the next build, so the scheme has
        # to be declared here instead.
        # Opt into native screen geometry instead of legacy 320-point compatibility mode.
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - amoo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amoo.companion
        INFOPLIST_FILE: HostApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Recovery.entitlements

  AmooCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Sources
      - path: ../../Sources/AmooCore/Geometry.swift
      - path: ../../Sources/AmooCore/PinchGesture.swift
      - path: ../../Sources/AmooCore/ElementSemantics.swift
      - path: ../../Sources/AmooCore/AccessibilityInspection.swift
      - path: ../../Sources/AmooCore/AccessibilityInspection+Codable.swift
      - path: ../../Sources/AmooCore/VoiceOverPhase.swift
      - path: ../../Sources/AmooCore/AccessibilityJourney.swift
      - path: ../../Sources/AmooCore/AccessibilityJourney+Validation.swift
      - path: ../../Sources/AmooCore/AccessibilityJourneyRunner.swift
      - path: ../../Sources/AmooCore/AccessibilityJourneyRunner+Evidence.swift
      - path: ../../Sources/AmooCore/AccessibilityJourneyRunner+Transition.swift
      - path: ../../Sources/AmooCore/VoiceOverTraversal+Lifetime.swift
      - path: ../../Sources/AmooCore/VoiceOverTraversal.swift
      - path: ../../Sources/AmooCore/VoiceOverRecoveryJournal.swift
      - path: GeneratedProtos
        optional: true
    dependencies:
      - target: AmooCompanion
      - package: grpc-swift-2
        product: GRPCCore
      - package: grpc-swift-nio-transport
        product: GRPCNIOTransportHTTP2
      - package: grpc-swift-protobuf
        product: GRPCProtobuf
      - package: swift-protobuf
        product: SwiftProtobuf
      - package: SwiftTestCommons
        product: TestCommons
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amoo.companion.uitests
        CODE_SIGN_ENTITLEMENTS: Recovery.entitlements
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        TEST_TARGET_NAME: AmooCompanion
    info:
      path: Sources/Info.plist
      properties:
        AmooRecoveryAppGroup: $(AMOO_RECOVERY_APP_GROUP)

  # macOS companion (experimental). The same XCUITest bridge and gRPC server, built for the Mac,
  # driving apps on this Mac's desktop. FastTapSynthesizer and the VoiceOver inspector are UIKit-only.
  AmooCompanionMac:
    type: application
    platform: macOS
    sources:
      - path: MacHostApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amoo.companion.mac
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

  AmooCompanionMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
          - Bridge/FastTapSynthesizer.swift
          - Bridge/NativeAccessibilityInspector.swift
          - Bridge/NativeAccessibilityInspector+Journey.swift
          - Bridge/NativeAccessibilityInspector+VoiceOver.swift
      - path: ../../Sources/AmooCore/Geometry.swift
      - path: ../../Sources/AmooCore/PinchGesture.swift
      - path: ../../Sources/AmooCore/ElementSemantics.swift
      - path: ../../Sources/AmooCore/AccessibilityInspection.swift
      - path: ../../Sources/AmooCore/AccessibilityInspection+Codable.swift
      - path: ../../Sources/AmooCore/VoiceOverPhase.swift
      - path: ../../Sources/AmooCore/AccessibilityJourney.swift
      - path: ../../Sources/AmooCore/AccessibilityJourney+Validation.swift
      - path: ../../Sources/AmooCore/AccessibilityJourneyRunner.swift
      - path: ../../Sources/AmooCore/AccessibilityJourneyRunner+Evidence.swift
      - path: ../../Sources/AmooCore/AccessibilityJourneyRunner+Transition.swift
      - path: ../../Sources/AmooCore/VoiceOverTraversal+Lifetime.swift
      - path: ../../Sources/AmooCore/VoiceOverTraversal.swift
      - path: ../../Sources/AmooCore/VoiceOverRecoveryJournal.swift
      - path: GeneratedProtos
        optional: true
    dependencies:
      - target: AmooCompanionMac
      - package: grpc-swift-2
        product: GRPCCore
      - package: grpc-swift-nio-transport
        product: GRPCNIOTransportHTTP2
      - package: grpc-swift-protobuf
        product: GRPCProtobuf
      - package: swift-protobuf
        product: SwiftProtobuf
      - package: SwiftTestCommons
        product: TestCommons
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amoo.companion.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        # Xcode runs a macOS UI-test runner in the App Sandbox with outgoing connections only, so
        # the gRPC server's bind failed with EPERM. The runner takes these from this target.
        ENABLE_APP_SANDBOX: YES
        ENABLE_INCOMING_NETWORK_CONNECTIONS: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        TEST_TARGET_NAME: AmooCompanionMac
