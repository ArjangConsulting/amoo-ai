reporter: "xcode"

included:
  - Sources
  - Tests

excluded:
  - .build
  - .swiftpm
  - DerivedData

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - convenience_type
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_in_static_references
  - redundant_nil_coalescing
  - sorted_imports
  - strict_fileprivate
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

analyzer_rules:
  - unused_import

line_length:
  warning: 120
  error: 140
  ignores_comments: true

identifier_name:
  min_length: 2
  max_length:
    warning: 40
    error: 60
  excluded:
    - id
    - x
    - y

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 450

file_length:
  warning: 500
  error: 800
