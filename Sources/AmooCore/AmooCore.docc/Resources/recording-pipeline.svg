<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="846" viewBox="0 0 1120 846" role="img" aria-labelledby="title desc"><title id="title">From exploration to a repeatable test</title><desc id="desc">Artifact flow • compilation and source generation are deterministic</desc><rect width="1120" height="846" rx="24" fill="#101c30"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="58" fill="#ffffff" font-size="30" font-weight="700">From exploration to a repeatable test</text><text x="48" y="91" fill="#aabbd2" font-size="17">Artifact flow • compilation and source generation are deterministic</text><rect x="48" y="122" width="1024" height="84" rx="12" fill="#20334d" stroke="#49617e"/><rect x="48" y="122" width="6" height="84" rx="3" fill="#59dfc0"/><text x="72" y="154" fill="#ffffff" font-size="23" font-weight="700">MCPServer records eligible tool calls</text><text x="72" y="183" fill="#cfdaea" font-size="18">Actions, assertions, diagnostics, and outcomes become session history.</text><path d="M560 210 v20 m-6 -6 l6 6 6 -6" stroke="#59dfc0" stroke-width="2" fill="none"/><rect x="48" y="238" width="1024" height="84" rx="12" fill="#20334d" stroke="#49617e"/><rect x="48" y="238" width="6" height="84" rx="3" fill="#59dfc0"/><text x="72" y="270" fill="#ffffff" font-size="23" font-weight="700">TestSession → report.json</text><text x="72" y="299" fill="#cfdaea" font-size="18">Persist redacted evidence and app-owned generated-test context.</text><path d="M560 326 v20 m-6 -6 l6 6 6 -6" stroke="#59dfc0" stroke-width="2" fill="none"/><rect x="48" y="354" width="1024" height="84" rx="12" fill="#20334d" stroke="#49617e"/><rect x="48" y="354" width="6" height="84" rx="3" fill="#59dfc0"/><text x="72" y="386" fill="#ffffff" font-size="23" font-weight="700">SessionCompiler + StudioProtocol</text><text x="72" y="415" fill="#cfdaea" font-size="18">Compile the report into a typed plan; retain warnings and unsupported-step details.</text><path d="M560 442 v20 m-6 -6 l6 6 6 -6" stroke="#59dfc0" stroke-width="2" fill="none"/><rect x="48" y="470" width="1024" height="84" rx="12" fill="#20334d" stroke="#49617e"/><rect x="48" y="470" width="6" height="84" rx="3" fill="#59dfc0"/><text x="72" y="502" fill="#ffffff" font-size="23" font-weight="700">plan.json + flow.json</text><text x="72" y="531" fill="#cfdaea" font-size="18">Review the plan for code generation; use the flow artifact for amoo flow replay.</text><path d="M560 558 v20 m-6 -6 l6 6 6 -6" stroke="#59dfc0" stroke-width="2" fill="none"/><rect x="48" y="586" width="1024" height="84" rx="12" fill="#20334d" stroke="#49617e"/><rect x="48" y="586" width="6" height="84" rx="3" fill="#59dfc0"/><text x="72" y="618" fill="#ffffff" font-size="23" font-weight="700">TestCodeGenerator → Swift / Kotlin</text><text x="72" y="647" fill="#cfdaea" font-size="18">Emit XCUITest, Espresso, or Compose Espresso using explicit app context.</text><path d="M560 674 v20 m-6 -6 l6 6 6 -6" stroke="#59dfc0" stroke-width="2" fill="none"/><rect x="48" y="702" width="1024" height="84" rx="12" fill="#20334d" stroke="#49617e"/><rect x="48" y="702" width="6" height="84" rx="3" fill="#59dfc0"/><text x="72" y="734" fill="#ffffff" font-size="23" font-weight="700">Your application test target</text><text x="72" y="763" fill="#cfdaea" font-size="18">Review, integrate, compile, and run the generated test in the app’s test environment.</text></g></svg>
