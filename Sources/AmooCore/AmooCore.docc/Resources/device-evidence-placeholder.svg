<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="498" viewBox="0 0 1120 498" role="img" aria-labelledby="title desc"><title id="title">Device evidence — placeholder</title><desc id="desc">Illustrative layout only • replace with a real fixture capture</desc><rect width="1120" height="498" rx="24" fill="#101c30"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="58" fill="#ffffff" font-size="30" font-weight="700">Device evidence — placeholder</text><text x="48" y="91" fill="#aabbd2" font-size="17">Illustrative layout only • replace with a real fixture capture</text><rect x="48" y="122" width="1024" height="84" rx="12" fill="#20334d" stroke="#49617e"/><rect x="48" y="122" width="6" height="84" rx="3" fill="#59dfc0"/><text x="72" y="154" fill="#ffffff" font-size="23" font-weight="700">01  Observe</text><text x="72" y="183" fill="#cfdaea" font-size="18">Future screenshot: the fixture app with stable accessibility identifiers visible.</text><path d="M560 210 v20 m-6 -6 l6 6 6 -6" stroke="#59dfc0" stroke-width="2" fill="none"/><rect x="48" y="238" width="1024" height="84" rx="12" fill="#20334d" stroke="#49617e"/><rect x="48" y="238" width="6" height="84" rx="3" fill="#59dfc0"/><text x="72" y="270" fill="#ffffff" font-size="23" font-weight="700">02  Act</text><text x="72" y="299" fill="#cfdaea" font-size="18">Future screenshot: the selected control and the resulting navigation or text input.</text><path d="M560 326 v20 m-6 -6 l6 6 6 -6" stroke="#59dfc0" stroke-width="2" fill="none"/><rect x="48" y="354" width="1024" height="84" rx="12" fill="#20334d" stroke="#49617e"/><rect x="48" y="354" width="6" height="84" rx="3" fill="#59dfc0"/><text x="72" y="386" fill="#ffffff" font-size="23" font-weight="700">03  Verify</text><text x="72" y="415" fill="#cfdaea" font-size="18">Future screenshot: the final screen paired with an explicit assertion result.</text></g></svg>
