<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="846" viewBox="0 0 1120 846" role="img" aria-labelledby="title desc"><title id="title">From test intent to device interaction</title><desc id="desc">Runtime flow • arrows show requests, not Swift package dependencies</desc><rect width="1120" height="846" rx="24" fill="#101c30"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="58" fill="#ffffff" font-size="30" font-weight="700">From test intent to device interaction</text><text x="48" y="91" fill="#aabbd2" font-size="17">Runtime flow • arrows show requests, not Swift package dependencies</text><rect x="48" y="122" width="1024" height="84" rx="12" fill="#20334d" stroke="#49617e"/><rect x="48" y="122" width="6" height="84" rx="3" fill="#59dfc0"/><text x="72" y="154" fill="#ffffff" font-size="23" font-weight="700">Local AI client / CLI</text><text x="72" y="183" fill="#cfdaea" font-size="18">An AI client calls amoo mcp serve over stdio; CLI commands also enter from the host.</text><path d="M560 210 v20 m-6 -6 l6 6 6 -6" stroke="#59dfc0" stroke-width="2" fill="none"/><rect x="48" y="238" width="1024" height="84" rx="12" fill="#20334d" stroke="#49617e"/><rect x="48" y="238" width="6" height="84" rx="3" fill="#59dfc0"/><text x="72" y="270" fill="#ffffff" font-size="23" font-weight="700">MCPServer + TestSession</text><text x="72" y="299" fill="#cfdaea" font-size="18">Dispatch tools, serialize device work, capture outcomes, and persist session history.</text><path d="M560 326 v20 m-6 -6 l6 6 6 -6" stroke="#59dfc0" stroke-width="2" fill="none"/><rect x="48" y="354" width="1024" height="84" rx="12" fill="#20334d" stroke="#49617e"/><rect x="48" y="354" width="6" height="84" rx="3" fill="#59dfc0"/><text x="72" y="386" fill="#ffffff" font-size="23" font-weight="700">IOSDriver / AndroidDriver</text><text x="72" y="415" fill="#cfdaea" font-size="18">Shared AmooCore protocols and types describe platform-neutral test intent.</text><path d="M560 442 v20 m-6 -6 l6 6 6 -6" stroke="#59dfc0" stroke-width="2" fill="none"/><rect x="48" y="470" width="1024" height="84" rx="12" fill="#20334d" stroke="#49617e"/><rect x="48" y="470" width="6" height="84" rx="3" fill="#59dfc0"/><text x="72" y="502" fill="#ffffff" font-size="23" font-weight="700">Two execution paths on the host</text><text x="72" y="531" fill="#cfdaea" font-size="18">UI: CompanionProtocol → gRPC  |  Lifecycle: ProcessRunner → simctl / devicectl / adb</text><path d="M560 558 v20 m-6 -6 l6 6 6 -6" stroke="#59dfc0" stroke-width="2" fill="none"/><rect x="48" y="586" width="1024" height="84" rx="12" fill="#20334d" stroke="#49617e"/><rect x="48" y="586" width="6" height="84" rx="3" fill="#59dfc0"/><text x="72" y="618" fill="#ffffff" font-size="23" font-weight="700">On-device companions</text><text x="72" y="647" fill="#cfdaea" font-size="18">iOS: XCUITest runner  |  Android: instrumentation + UIAutomator</text><path d="M560 674 v20 m-6 -6 l6 6 6 -6" stroke="#59dfc0" stroke-width="2" fill="none"/><rect x="48" y="702" width="1024" height="84" rx="12" fill="#20334d" stroke="#49617e"/><rect x="48" y="702" width="6" height="84" rx="3" fill="#59dfc0"/><text x="72" y="734" fill="#ffffff" font-size="23" font-weight="700">Application under test</text><text x="72" y="763" fill="#cfdaea" font-size="18">Interact with controls and return structured hierarchy, action results, and evidence.</text></g></svg>
