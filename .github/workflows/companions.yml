name: Companion builds and smoke tests
on:
  pull_request:
    paths:
      - 'CompanionApps/**'
      - 'Protos/**'
      - 'Sources/**'
      - 'Tests/IntegrationTests/**'
      - 'scripts/**'
      - 'Package.*'
      - 'Makefile'
      - '.github/workflows/companions.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companions-${{ github.ref }}
  cancel-in-progress: true
env:
  AMOO_E2E_STRICT: '1'
  AMOO_E2E_FILTER: 'IntegrationTests.CommandContractE2ETests/test(StartAndEndSession|FixtureHomeQueries|NavigateToDetailsAndScroll|TextEntryAndClearing)'
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install protobuf swift-protobuf protoc-gen-grpc-swift xcodegen
      - run: make companion-ios-build
      - name: Simulator smoke
        run: scripts/run-e2e-ios.sh --skip-build 2>&1 | tee smoke-ios.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-smoke
          path: |
            smoke-ios.log
            CompanionApps/iOS/build/Logs/Test/*.xcresult
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.3'
      - uses: android-actions/setup-android@v4
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: make companion-android-build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash -o pipefail -c 'scripts/run-e2e-android.sh 2>&1 | tee smoke-android.log'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: |
            smoke-android.log
            CompanionApps/Android/app/build/reports/**
