name: Companion builds and smoke tests
on:
  pull_request:
    paths:
      - 'CompanionApps/**'
      - 'Protos/**'
      - 'Sources/**'
      - 'Tests/IntegrationTests/**'
      - 'scripts/**'
      - 'Package.*'
      - 'Makefile'
      - '.github/workflows/companions.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companions-${{ github.ref }}
  cancel-in-progress: true
env:
  AMOO_E2E_STRICT: '1'
  AMOO_E2E_FILTER: 'IntegrationTests.CommandContractE2ETests/test(StartAndEndSession|FixtureHomeQueries|NavigateToDetailsAndScroll|TextEntryAndClearing)'
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-companion-${{ hashFiles('.github/workflows/companions.yml') }}
          restore-keys: brew-${{ runner.os }}-companion-
      - run: brew install protobuf swift-protobuf protoc-gen-grpc-swift xcodegen
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-companion-ios-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-companion-ios-
      - run: make companion-ios-build
      - name: Simulator smoke
        run: scripts/run-e2e-ios.sh --skip-build 2>&1 | tee smoke-ios.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-smoke
          path: |
            smoke-ios.log
            CompanionApps/iOS/build/Logs/Test/*.xcresult
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Swift toolchain (Swiftly)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/swiftly
          key: swiftly-${{ runner.os }}-6.3
      - name: Install Swift 6.3 via Swiftly
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.local/share/swiftly/bin/swiftly" ]; then
            arch="$(uname -m)"
            curl -fsSL -O "https://download.swift.org/swiftly/linux/swiftly-${arch}.tar.gz"
            tar -zxf "swiftly-${arch}.tar.gz"
            ./swiftly init --assume-yes --skip-install --quiet-shell-followup --no-modify-profile
          fi
          . "$HOME/.local/share/swiftly/env.sh"
          swiftly install --use --assume-yes 6.3
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"
          swift --version
      - uses: android-actions/setup-android@v4
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-companion-android-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-companion-android-
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('CompanionApps/Android/**/*.gradle.kts', 'CompanionApps/Android/gradle.properties', 'CompanionApps/Android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: make companion-android-build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash -o pipefail -c 'scripts/run-e2e-android.sh 2>&1 | tee smoke-android.log'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: |
            smoke-android.log
            CompanionApps/Android/app/build/reports/**
