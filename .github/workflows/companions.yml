name: Companion builds and smoke tests
on:
  pull_request:
    paths:
      - 'CompanionApps/**'
      - 'Protos/**'
      - 'Sources/**'
      - 'Tests/IntegrationTests/**'
      - 'scripts/**'
      - 'Package.*'
      - 'Makefile'
      - '.github/workflows/companions.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companions-${{ github.ref }}
  cancel-in-progress: true
env:
  AMOO_E2E_STRICT: '1'
  # After the first failing E2E test, skip the rest instead of waiting out each one's timeouts.
  AMOO_E2E_FAIL_FAST: '1'
  AMOO_E2E_FILTER: 'IntegrationTests.CommandContractE2ETests'
jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Cache Homebrew packages
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-companion-${{ hashFiles('.github/workflows/companions.yml') }}
          restore-keys: brew-${{ runner.os }}-companion-
      - run: brew install protobuf swift-protobuf protoc-gen-grpc-swift xcodegen
      # Kick the simulator boot off before the ~15 min of builds so it finishes in the background
      # instead of adding a 2-7 min serial wait afterwards. `simctl boot` returns immediately.
      - name: Start iOS simulator boot
        timeout-minutes: 3
        id: simulator
        shell: bash
        run: |
          simulator_id="$(python3 - <<'PY'
          import json
          import re
          import subprocess

          catalog = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"]
          ))
          # Only plain iOS runtimes (iOS-27-2). Device-specific variants such as
          # iOS-27-2-iPhone19-4 have a non-numeric suffix and are skipped.
          runtime_pattern = re.compile(r"\.iOS-(\d+(?:-\d+)*)$")
          candidates = [
              (tuple(map(int, match.group(1).split("-"))), device["name"], device["udid"])
              for runtime, devices in catalog["devices"].items()
              for match in [runtime_pattern.search(runtime)] if match
              for device in devices if device["name"].startswith("iPhone")
          ]
          if not candidates:
              raise SystemExit("No available iPhone simulator runtime is installed")
          newest = max(version for version, _, _ in candidates)
          print(min((name, udid) for version, name, udid in candidates if version == newest)[1])
          PY
          )"
          # Already-booted is fine; the wait step below fails if the device never becomes ready.
          xcrun simctl boot "$simulator_id" || true
          echo "udid=$simulator_id" >> "$GITHUB_OUTPUT"
      # hashFiles walks the whole workspace and has timed out (120 s) while the simulator boot above
      # loads the disk; hashing the two key files directly does not.
      - name: Compute cache keys
        id: keys
        shell: bash
        run: |
          echo "package=$(shasum -a 256 Package.resolved | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "project=$(shasum -a 256 CompanionApps/iOS/project.yml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore host SPM dependencies
        id: host-spm
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: spm-companion-ios-${{ steps.keys.outputs.package }}
      # xcodebuild otherwise re-clones ~20 packages (~2.5 min) on every run. Only the fetched
      # sources are cached; compiled products are rebuilt (project.yml pins exact versions).
      - name: Restore companion SPM checkouts
        uses: actions/cache@v6
        with:
          path: CompanionApps/iOS/build/SourcePackages
          key: spm-companion-xcode-${{ steps.keys.outputs.project }}
      - run: make companion-ios-build
      - name: Build host integration tests
        run: swift build --build-tests
      # Keep a successful host build even if the later device smoke fails.
      - name: Save host SPM dependencies
        if: steps.host-spm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.host-spm.outputs.cache-primary-key }}
      - name: Wait for iOS simulator
        timeout-minutes: 8
        shell: bash
        run: xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b
      - name: Simulator smoke
        timeout-minutes: 15
        shell: bash
        run: scripts/run-e2e-ios.sh --skip-build --skip-test-build --device "${{ steps.simulator.outputs.udid }}" 2>&1 | tee smoke-ios.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-smoke
          path: |
            smoke-ios.log
            companion-ios.log
            CompanionApps/iOS/build/companion-ios-build.log
            CompanionApps/iOS/build/Logs/Test/*.xcresult
  macos:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      AMOO_MACOS_SMOKE_DIR: ${{ github.workspace }}/macos-smoke
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Cache Homebrew packages
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-companion-${{ hashFiles('.github/workflows/companions.yml') }}
          restore-keys: brew-${{ runner.os }}-companion-
      - run: brew install protobuf swift-protobuf protoc-gen-grpc-swift xcodegen
      - name: Compute cache keys
        id: keys
        shell: bash
        run: |
          echo "package=$(shasum -a 256 Package.resolved | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "project=$(shasum -a 256 CompanionApps/iOS/project.yml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore host SPM dependencies
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-companion-macos-${{ steps.keys.outputs.package }}
      - name: Restore companion SPM checkouts
        uses: actions/cache@v6
        with:
          path: CompanionApps/iOS/build/SourcePackages
          key: spm-companion-xcode-${{ steps.keys.outputs.project }}
      - run: make companion-ios-protos
      - run: swift build --product amoo
      # Drives Calculator on the runner's own desktop. macOS refuses UI automation until Automation
      # Mode may start without a password prompt, which needs passwordless sudo on the runner. The
      # runner's screen is small enough that the Dock covers Calculator's bottom row, so hide it.
      - name: macOS smoke
        timeout-minutes: 20
        shell: bash
        run: |
          mkdir -p "$AMOO_MACOS_SMOKE_DIR"
          set -o pipefail
          scripts/run-e2e-macos.sh --enable-automation-mode --hide-dock 2>&1 | tee "$AMOO_MACOS_SMOKE_DIR/smoke-macos.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-smoke
          path: macos-smoke
  android:
    # Pinned to the distro of CI's swift:6.4-noble container. ubuntu-latest moved to 26.04, which
    # ships libxml2 only as libxml2.so.16, and the 24.04 Swift toolchain needs libxml2.so.2.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Swift toolchain (Swiftly)
        uses: actions/cache@v6
        with:
          path: ~/.local/share/swiftly
          # The toolchain is built for one distro, so a runner image change must not restore it.
          key: swiftly-${{ runner.os }}-ubuntu24.04-6.4
      - name: Install Swift 6.4 via Swiftly
        shell: bash
        run: |
          set -euo pipefail
          # Toolchain runtime deps swiftly expects but will not install itself; without
          # libcurl4-openssl-dev `swiftly install` exits non-zero after a successful install.
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
          if [ ! -x "$HOME/.local/share/swiftly/bin/swiftly" ]; then
            arch="$(uname -m)"
            curl -fsSL -O "https://download.swift.org/swiftly/linux/swiftly-${arch}.tar.gz"
            tar -zxf "swiftly-${arch}.tar.gz"
            ./swiftly init --assume-yes --skip-install --quiet-shell-followup --no-modify-profile
          fi
          . "$HOME/.local/share/swiftly/env.sh"
          swiftly install --use --assume-yes 6.4
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"
          swift --version
      - uses: android-actions/setup-android@v4
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Cache SPM dependencies
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-companion-android-${{ hashFiles('Package.resolved') }}
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('CompanionApps/Android/**/*.gradle.kts', 'CompanionApps/Android/gradle.properties', 'CompanionApps/Android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: make companion-android-build
      - run: make sample-app-compose-build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            make sample-app-compose-test
            (cd CompanionApps/Android && ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.amoo.companion.bridge.HierarchyCaptureTests)
            bash -o pipefail -c 'scripts/run-e2e-android.sh 2>&1 | tee smoke-android.log'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-smoke
          path: |
            smoke-android.log
            logcat-android.log
            CompanionApps/Android/app/build/reports/**
            CompanionApps/Android/composeSampleApp/build/reports/**
