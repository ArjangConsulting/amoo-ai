name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to publish — an existing tag to rebuild, or a new version to cut
        required: true
        type: string
      highlights:
        description: Optional Markdown release highlights (otherwise up to five commit summaries)
        required: false
        type: string

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Resolve the release to an immutable commit before anything is built, so every job builds the
  # same tree and `publish` can tag exactly what was verified. A tag push always resolves to its
  # tag; a manual dispatch resolves to the tag when it exists (rebuild) and to the dispatched ref
  # otherwise, which is what lets a dispatch cut a brand-new version instead of failing checkout.
  preflight:
    name: Resolve release commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout selected commit and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve ${{ env.RELEASE_VERSION }}
        id: resolve
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a bare SemVer release tag, e.g. 1.2.3."
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/${version}"; then
            sha="$(git rev-parse "refs/tags/${version}^{commit}")"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "::error::Release tag is missing."
            exit 1
          else
            # Checkout defaults to the event SHA, even if the selected branch has moved.
            sha="$(git rev-parse HEAD)"
            echo "::notice::Creating ${version} at ${sha} after verification."
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  verify:
    needs: preflight
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Homebrew packages
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar/protobuf
            /usr/local/Cellar/swiftformat
            /usr/local/Cellar/swiftlint
          key: brew-${{ runner.os }}-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: brew-${{ runner.os }}-

      - name: Install tooling
        run: |
          brew install protobuf swift-protobuf protoc-gen-grpc-swift swiftformat swiftlint xcodegen kotlin

      - name: Cache SPM dependencies
        uses: actions/cache@v6
        with:
          path: .build
          key: release-verify-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            release-verify-spm-

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('CompanionApps/Android/**/*.gradle.kts', 'CompanionApps/Android/gradle.properties', 'CompanionApps/Android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Export protoc path
        run: |
          echo "PROTOC_PATH=$(brew --prefix protobuf)/bin/protoc" >> "$GITHUB_ENV"

      - name: Lint
        run: ./scripts/ci/lint.sh

      - name: Test + Coverage Gate
        run: ./scripts/ci/test_coverage.sh

      - name: Build and package prebuilt companions
        run: |
          ./scripts/package-companions.sh
          tar -czf prebuilt-companions.tar.gz CompanionApps/iOS/prebuilt CompanionApps/Android/prebuilt

      - name: Upload prebuilt companions
        uses: actions/upload-artifact@v7
        with:
          name: prebuilt-companions
          path: prebuilt-companions.tar.gz
          retention-days: 7

  build-macos:
    name: Build macOS Universal Binary
    needs: [preflight, verify]
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Homebrew packages
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar/protobuf
          key: brew-${{ runner.os }}-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: brew-${{ runner.os }}-

      - name: Install tooling
        run: |
          brew install protobuf

      - name: Export protoc path
        run: |
          echo "PROTOC_PATH=$(brew --prefix protobuf)/bin/protoc" >> "$GITHUB_ENV"

      - name: Stamp version from tag
        run: |
          sed -i.bak 's/public static let current = .*/public static let current = "'"${RELEASE_VERSION}"'"/' Sources/AmooCore/Version.swift
          sed -i.bak 's/public static let releaseVersion = "[^"]*"/public static let releaseVersion = "'"${RELEASE_VERSION}"'"/' Sources/AmooCore/Version.swift
          rm -f Sources/AmooCore/Version.swift.bak
          grep -q "public static let current = \"${RELEASE_VERSION}\"" Sources/AmooCore/Version.swift
          for manifest in plugins/amoo/plugin.json plugins/amoo/.claude-plugin/plugin.json plugins/amoo/.cursor-plugin/plugin.json plugins/amoo/gemini-extension.json plugins/amoo-live/.claude-plugin/plugin.json; do
            sed -i.bak 's/"version": "[^"]*"/"version": "'"${RELEASE_VERSION}"'"/' "$manifest"
            rm -f "$manifest.bak"
            grep -q "\"version\": \"${RELEASE_VERSION}\"" "$manifest"
          done

      - name: Cache SPM dependencies
        uses: actions/cache@v6
        with:
          path: .build
          key: release-macos-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            release-macos-spm-

      # Swift 6.4's build system writes every architecture to one products directory, so a
      # per-architecture build would overwrite the other; one multi-arch build emits the fat binary.
      - name: Build universal binary
        run: |
          swift build \
            --configuration release \
            --product amoo \
            --arch arm64 \
            --arch x86_64 \
            --disable-sandbox
          cp "$(swift build --configuration release --arch arm64 --arch x86_64 --show-bin-path)/amoo" amoo
          lipo amoo -verify_arch arm64 x86_64
          lipo -info amoo

      - name: Smoke test stamped binary
        run: |
          test "$(./amoo --version)" = "${RELEASE_VERSION}"
          ./amoo --help >/dev/null
          python3 scripts/ci/mcp-smoke.py ./amoo --arch arm64
          python3 scripts/ci/mcp-smoke.py ./amoo --arch x86_64
          swift --version > release-toolchain.txt
          cp Package.resolved release-dependencies.json

      - name: Download prebuilt companions
        uses: actions/download-artifact@v8
        with:
          name: prebuilt-companions

      - name: Extract prebuilt companions
        run: tar -xzf prebuilt-companions.tar.gz

      - name: Package tarball
        run: |
          VERSION="${RELEASE_VERSION}"
          tar -czf "amoo-${VERSION}-macos-universal.tar.gz" \
            amoo \
            CompanionApps/iOS \
            CompanionApps/Android \
            release-toolchain.txt \
            release-dependencies.json \
            scripts/install-mcp.sh \
            plugins/amoo
          tar -tzf "amoo-${VERSION}-macos-universal.tar.gz" | grep -qx 'amoo'
          tar -tzf "amoo-${VERSION}-macos-universal.tar.gz" | grep -qx 'plugins/amoo/agents/amoo.md'
          tar -tzf "amoo-${VERSION}-macos-universal.tar.gz" | grep -qx 'plugins/amoo/.claude-plugin/plugin.json'
          tar -tzf "amoo-${VERSION}-macos-universal.tar.gz" | grep -qx 'CompanionApps/iOS/project.yml'
          tar -tzf "amoo-${VERSION}-macos-universal.tar.gz" | grep 'CompanionApps/iOS/prebuilt/iphonesimulator/Products/.*xctestrun$'
          tar -tzf "amoo-${VERSION}-macos-universal.tar.gz" | grep 'CompanionApps/iOS/prebuilt/iphoneos/Products/.*xctestrun$'
          tar -tzf "amoo-${VERSION}-macos-universal.tar.gz" | grep -qx 'CompanionApps/Android/gradlew'
          tar -tzf "amoo-${VERSION}-macos-universal.tar.gz" | grep -qx 'CompanionApps/Android/prebuilt/app-debug.apk'
          tar -tzf "amoo-${VERSION}-macos-universal.tar.gz" | grep -qx 'scripts/install-mcp.sh'
          echo "TARBALL=amoo-${VERSION}-macos-universal.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: ${{ env.TARBALL }}
          retention-days: 7

  build-linux:
    name: Build Linux Static Binary
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    # amoo's Swift code compiles on Linux even though iOS-simulator/Xcode-project features
    # (XcodeBuildKit, XcodeGenKit, XCUITest bridge) are functionally macOS-only at runtime —
    # they shell out to tools that don't exist on Linux and fail gracefully via `preflight`,
    # the same pattern ShipItSwifty itself uses for its own XcodeBuildKit/XcodeGenKit targets.
    container:
      image: swift:6.4-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Install protoc
        run: |
          apt-get update -qq
          apt-get install -y -qq protobuf-compiler python3
          echo "PROTOC_PATH=$(which protoc)" >> "$GITHUB_ENV"

      - name: Stamp version from tag
        run: |
          sed -i.bak 's/public static let current = .*/public static let current = "'"${RELEASE_VERSION}"'"/' Sources/AmooCore/Version.swift
          sed -i.bak 's/public static let releaseVersion = "[^"]*"/public static let releaseVersion = "'"${RELEASE_VERSION}"'"/' Sources/AmooCore/Version.swift
          rm -f Sources/AmooCore/Version.swift.bak
          grep -q "public static let current = \"${RELEASE_VERSION}\"" Sources/AmooCore/Version.swift
          for manifest in plugins/amoo/plugin.json plugins/amoo/.claude-plugin/plugin.json plugins/amoo/.cursor-plugin/plugin.json plugins/amoo/gemini-extension.json plugins/amoo-live/.claude-plugin/plugin.json; do
            sed -i.bak 's/"version": "[^"]*"/"version": "'"${RELEASE_VERSION}"'"/' "$manifest"
            rm -f "$manifest.bak"
            grep -q "\"version\": \"${RELEASE_VERSION}\"" "$manifest"
          done

      - name: Swift version
        run: swift --version

      - name: Cache SPM dependencies
        uses: actions/cache@v6
        with:
          path: .build
          key: release-linux-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            release-linux-spm-

      - name: Build static binary
        run: |
          swift build \
            --configuration release \
            --product amoo \
            --static-swift-stdlib

      - name: Smoke test stamped binary
        run: |
          test "$(.build/release/amoo --version)" = "${RELEASE_VERSION}"
          .build/release/amoo --help >/dev/null
          python3 scripts/ci/mcp-smoke.py .build/release/amoo
          swift --version > release-toolchain.txt
          cp Package.resolved release-dependencies.json

      - name: Download prebuilt companions
        uses: actions/download-artifact@v8
        with:
          name: prebuilt-companions

      - name: Extract prebuilt companions
        run: tar -xzf prebuilt-companions.tar.gz

      - name: Package tarball
        run: |
          VERSION="${RELEASE_VERSION}"
          cp .build/release/amoo amoo
          tar -czf "amoo-${VERSION}-linux-static.tar.gz" \
            amoo \
            CompanionApps/Android \
            release-toolchain.txt \
            release-dependencies.json \
            scripts/install-mcp.sh \
            plugins/amoo
          tar -tzf "amoo-${VERSION}-linux-static.tar.gz" | grep -qx 'amoo'
          tar -tzf "amoo-${VERSION}-linux-static.tar.gz" | grep -qx 'plugins/amoo/agents/amoo.md'
          tar -tzf "amoo-${VERSION}-linux-static.tar.gz" | grep -qx 'CompanionApps/Android/gradlew'
          tar -tzf "amoo-${VERSION}-linux-static.tar.gz" | grep -qx 'CompanionApps/Android/prebuilt/app-debug.apk'
          tar -tzf "amoo-${VERSION}-linux-static.tar.gz" | grep -qx 'scripts/install-mcp.sh'
          echo "TARBALL=amoo-${VERSION}-linux-static.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-static
          path: ${{ env.TARBALL }}
          retention-days: 7

  publish:
    name: Create GitHub Release
    needs: [preflight, build-macos, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          # Full history and tags: the release notes are generated from the commits in the range
          # `previous-tag..this-release`, which needs more than the default single-commit clone.
          fetch-depth: 0
          fetch-tags: true

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-universal

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-static

      - name: Write checksums
        # Consumers that embed amoo, such as Amoo Studio's release, verify the tarball against
        # these before unpacking it. The format matches `shasum -a 256` / `sha256sum` output.
        run: |
          for tarball in amoo-*-macos-universal.tar.gz amoo-*-linux-static.tar.gz; do
            sha256sum "$tarball" > "$tarball.sha256"
          done

      - name: Generate release notes
        env:
          RELEASE_HIGHLIGHTS: ${{ inputs.highlights }}
        run: |
          printf '%s\n' "$RELEASE_HIGHLIGHTS" > "$RUNNER_TEMP/release-highlights.md"
          bash scripts/ci/generate-release-notes.sh "${RELEASE_VERSION}" \
            --target "${{ needs.preflight.outputs.sha }}" \
            --highlights "$RUNNER_TEMP/release-highlights.md" \
            --repo "${GITHUB_REPOSITORY}" \
            --output release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          # Only consulted when the tag doesn't exist yet (a bootstrapping dispatch), where it pins
          # the new tag to the commit these binaries were built from.
          target_commitish: ${{ needs.preflight.outputs.sha }}
          body_path: release-notes.md
          files: |
            amoo-*-macos-universal.tar.gz
            amoo-*-macos-universal.tar.gz.sha256
            amoo-*-linux-static.tar.gz
            amoo-*-linux-static.tar.gz.sha256

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not set — skipping tap update. Render Formula/amoo.rb and push to the tap manually per docs/homebrew.md."
            exit 0
          fi

          macos_sha=$(sha256sum "amoo-${VERSION}-macos-universal.tar.gz" | awk '{print $1}')
          linux_sha=$(sha256sum "amoo-${VERSION}-linux-static.tar.gz" | awk '{print $1}')

          # tail -n +5 drops the template's 4-line header comment — it describes the
          # placeholder mechanics, which don't apply to the rendered file that ships to the tap.
          sed -e "s/VERSION_PLACEHOLDER/${VERSION}/g" \
              -e "s/MACOS_SHA256_PLACEHOLDER/${macos_sha}/g" \
              -e "s/LINUX_SHA256_PLACEHOLDER/${linux_sha}/g" \
              Formula/amoo.rb | tail -n +5 > rendered-amoo.rb
          echo "Rendered formula:"
          cat rendered-amoo.rb

          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/ArjangConsulting/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp rendered-amoo.rb tap/Formula/amoo.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/amoo.rb
          if git diff --cached --quiet; then
            echo "Tap formula already up to date for ${VERSION}."
          else
            git commit -m "amoo ${VERSION}"
            git push
          fi
