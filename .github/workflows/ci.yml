name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  quality-and-tests:
    # Xcode 27 (Swift 6.4). macos-latest still defaults to Xcode 26.6 (Swift 6.3), whose release
    # builds aborted in SwiftyTerminal's withSpinner; see Sources/CLI/CLISpinner.swift.
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar/swiftformat
            /usr/local/Cellar/swiftlint
          key: brew-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: brew-${{ runner.os }}-

      - name: Install tooling
        run: |
          brew install swiftformat swiftlint

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}

      - name: Lint
        run: ./scripts/ci/lint.sh

      - name: Test orchestration scripts
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Release MCP and subprocess regression gate
        run: |
          swift build -c release --product amoo
          python3 scripts/ci/mcp-smoke.py .build/release/amoo
          # CLI test helpers require DEBUG; optimization remains enabled.
          swift test -c release -Xswiftc -DDEBUG --filter ProcessRunnerTests

      - name: Test + Coverage Gate
        run: ./scripts/ci/test_coverage.sh

      - name: Check agent install round trip
        run: |
          agent_target="$(mktemp -d)"
          trap 'rm -rf "$agent_target"' EXIT
          .build/release/amoo agent install --target "$agent_target" --client all --json
          python3 plugins/amoo/skills/driving-amoo/scripts/check-install.py \
            --amoo "$PWD/.build/release/amoo" --target "$agent_target" --client all

  build-and-test-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    # amoo's Swift code compiles on Linux even though iOS-simulator/Xcode-project features
    # (XcodeBuildKit, XcodeGenKit, XCUITest bridge) are functionally macOS-only at runtime —
    # they shell out to tools that don't exist on Linux and fail gracefully via `preflight`.
    # No lint here: swiftformat/swiftlint aren't installed in this container, and
    # scripts/ci/test_coverage.sh depends on `xcrun llvm-cov`, which is Darwin-only.
    container:
      image: swift:6.4-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        run: |
          apt-get update -qq
          apt-get install -y -qq protobuf-compiler python3
          echo "PROTOC_PATH=$(which protoc)" >> "$GITHUB_ENV"

      - name: Swift version
        run: swift --version

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-linux-${{ hashFiles('Package.resolved') }}

      - name: Build
        run: swift build --product amoo

      - name: Test orchestration scripts
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Test
        # CLIQualityCoverageTests' Android preflight checks scan the real host for a JDK
        # (AndroidJDK.discover()) rather than going through the injected process runner, so on a
        # bare Linux runner without JDK 17-21 installed they fail regardless of platform-gating —
        # not a Linux-compatibility issue, just a host tooling gap. Skipped here the same way
        # ShipItSwifty skips its own macOS-only test targets on Linux.
        run: swift test --skip IntegrationTests --skip CLIQualityCoverageTests

      # Host builds no longer run the protobuf plugin (it compiled protoc from C++ source on every
      # clean build), so this is the one place that proves Sources/Protos/Generated matches
      # Protos/*.proto. Fix a failure with `make protos` and commit the result.
      - name: Check generated protos are current
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/regenerate-protos.sh --check
